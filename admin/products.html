<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Food Products – CAMPUS FOOD | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon" style="width: 36px; height: 36px; font-size: 1.1rem;">🍔</div>
          <div class="brand-text">
            <div class="brand-title" style="font-size: 1.05rem;">CAMPUS <span>ADMIN</span></div>
            <div class="brand-sub">AKTU Canteen</div>
          </div>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="/admin/dashboard.html" class="admin-nav-item">
          <span>📊</span> Dashboard Overview
        </a>
        <a href="/admin/orders.html" class="admin-nav-item">
          <span>📋</span> Orders Management
        </a>
        <a href="/admin/products.html" class="admin-nav-item active">
          <span>🍕</span> Food Products
        </a>
        <a href="/admin/categories.html" class="admin-nav-item">
          <span>🗂️</span> Food Categories
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/index.html" class="btn-secondary" style="width: 100%; font-size: 0.8rem; padding: 0.5rem; justify-content: flex-start;">
          <span>🌐</span> View Student Website
        </a>
      </div>
    </aside>

    <!-- Content Area -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-sidebar-toggle" class="btn-secondary" style="padding: 0.4rem 0.6rem; font-size: 1rem; display: none;">
            ☰
          </button>
          <div>
            <h2 style="font-size: 1.25rem; font-weight: 800;">Canteen Food Products & Inventory</h2>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Manage dishes, prices, and instant in-stock availability</div>
          </div>
        </div>

        <button id="open-add-product-btn" class="btn-primary" style="font-size: 0.85rem; padding: 0.55rem 1.1rem;">
          + Add New Food Item
        </button>
      </header>

      <div class="admin-content-body">
        <div class="admin-table-card">
          <!-- Filters Header -->
          <div class="table-header-bar">
            <div style="display: flex; gap: 1rem; align-items: center; flex: 1; flex-wrap: wrap;">
              <input type="text" id="product-search-input" class="form-control" placeholder="Search product name..." style="max-width: 280px; padding: 0.45rem 0.85rem; font-size: 0.85rem;" />
              <select id="product-filter-category" class="form-control" style="width: auto; padding: 0.45rem 0.85rem; font-size: 0.85rem;">
                <option value="all">All Categories</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Availability (Live Toggle)</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-tbody">
                <!-- Rendered dynamically by js/admin.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Product Modal Dialog -->
  <div class="modal-backdrop" id="product-modal">
    <div class="modal-box">
      <button class="modal-close-btn" id="close-product-modal">&times;</button>
      <h3 id="product-modal-title" style="font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;">Add New Food Item</h3>

      <form id="product-form">
        <input type="hidden" id="product-id-input" />

        <div class="form-group">
          <label class="form-label">Dish Name <span style="color: var(--accent-orange);">*</span></label>
          <input type="text" id="product-modal-name" class="form-control" placeholder="e.g. Paneer Butter Masala Roll" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Price (₹) <span style="color: var(--accent-orange);">*</span></label>
            <input type="number" id="product-modal-price" class="form-control" placeholder="70" step="1" min="0" required />
          </div>
          <div class="form-group">
            <label class="form-label">Category <span style="color: var(--accent-orange);">*</span></label>
            <select id="product-modal-category" class="form-control" required></select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Food Type</label>
            <select id="product-modal-veg" class="form-control">
              <option value="true">🟢 Pure Veg</option>
              <option value="false">🔴 Non-Veg</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="url" id="product-modal-image" class="form-control" placeholder="https://images.unsplash.com/..." />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description / Ingredients</label>
          <textarea id="product-modal-desc" class="form-control" rows="3" placeholder="Crisp fresh ingredients prepared daily in the canteen kitchen..."></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
          <button type="submit" class="btn-primary" style="flex: 1;">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
