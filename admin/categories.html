<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Food Categories – CAMPUS FOOD | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon" style="width: 36px; height: 36px; font-size: 1.1rem;">🍔</div>
          <div class="brand-text">
            <div class="brand-title" style="font-size: 1.05rem;">CAMPUS <span>ADMIN</span></div>
            <div class="brand-sub">AKTU Canteen</div>
          </div>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="/admin/dashboard.html" class="admin-nav-item">
          <span>📊</span> Dashboard Overview
        </a>
        <a href="/admin/orders.html" class="admin-nav-item">
          <span>📋</span> Orders Management
        </a>
        <a href="/admin/products.html" class="admin-nav-item">
          <span>🍕</span> Food Products
        </a>
        <a href="/admin/categories.html" class="admin-nav-item active">
          <span>🗂️</span> Food Categories
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/index.html" class="btn-secondary" style="width: 100%; font-size: 0.8rem; padding: 0.5rem; justify-content: flex-start;">
          <span>🌐</span> View Student Website
        </a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="admin-sidebar-toggle" class="btn-secondary" style="padding: 0.4rem 0.6rem; font-size: 1rem; display: none;">
            ☰
          </button>
          <div>
            <h2 style="font-size: 1.25rem; font-weight: 800;">Canteen Menu Categories</h2>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Organize food menu sections for student browsing</div>
          </div>
        </div>

        <button id="open-add-category-btn" class="btn-primary" style="font-size: 0.85rem; padding: 0.55rem 1.1rem;">
          + Add New Category
        </button>
      </header>

      <div class="admin-content-body">
        <div class="admin-table-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Category Name</th>
                  <th>Menu Items Count</th>
                  <th>Category ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table-tbody">
                <!-- Rendered dynamically by js/admin.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal-backdrop" id="category-modal">
    <div class="modal-box">
      <button class="modal-close-btn" id="close-category-modal">&times;</button>
      <h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;">Canteen Food Category</h3>

      <form id="category-form">
        <input type="hidden" id="category-id-input" />
        <div class="form-group">
          <label class="form-label">Category Name <span style="color: var(--accent-orange);">*</span></label>
          <input type="text" id="category-modal-name" class="form-control" placeholder="e.g. Desserts & Shakes" required />
        </div>
        <div class="form-group">
          <label class="form-label">Cover Image URL</label>
          <input type="url" id="category-modal-image" class="form-control" placeholder="https://images.unsplash.com/..." />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
          Save Category
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
